name: CI

on:
  push:
    branches-ignore: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/cache@v4
        with:
          path: .cache/mojang
          key: mojang-1.5.2-${{ hashFiles('scripts/fetch-assets.mjs') }}
          restore-keys: mojang-1.5.2-
      - run: npm run build
