name: Forge 1.8.9 mod

# Builds the Poly Player Models mod (mods/forge-1.8.9) and uploads the jar.
on:
  push:
    paths:
      - 'mods/forge-1.8.9/**'
      - 'public/models/**'
      - '.github/workflows/forge-mod.yml'
  pull_request:
    paths:
      - 'mods/forge-1.8.9/**'
      - 'public/models/**'
      - '.github/workflows/forge-mod.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mods/forge-1.8.9
    steps:
      - uses: actions/checkout@v5
      - uses: gradle/actions/wrapper-validation@v4
      # Gradle runs on Java 17 (the last one listed becomes JAVA_HOME); the mod is compiled,
      # tested and remapped with the Java 8 toolchain (found through JAVA_HOME_8_X64).
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            8
            17
      - uses: gradle/actions/setup-gradle@v4
      - name: Copy the built-in models (public/models/*/model.mcpm) into the mod's resources
        run: ./gradlew copyBuiltinModels --no-daemon -Porg.gradle.java.installations.fromEnv=JAVA_HOME_8_X64
      - name: Build (compile, decoder tests against the web game's decoder, remapped jar)
        run: ./gradlew build --no-daemon -Porg.gradle.java.installations.fromEnv=JAVA_HOME_8_X64
      - uses: actions/upload-artifact@v4
        with:
          name: polymodels-1.0.0
          path: mods/forge-1.8.9/build/libs/polymodels-*.jar
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-reports
          path: mods/forge-1.8.9/build/reports/tests/
